<svg xmlns="http://www.w3.org/2000/svg" width="640" height="120" viewBox="0 0 640 120">
  <rect width="640" height="120" fill="#f6f8fa"/>
  <g transform="translate(20,20)">
    <p style="font-family: Arial, Helvetica, sans-serif; font-size:14px;"/>
    <text x="0" y="18" font-family="Arial" font-size="14" fill="#222">This is an example sentence with a term link:</text>
    <a>
      <rect x="260" y="2" rx="4" ry="4" width="60" height="20" fill="#0366d6"/>
      <text x="275" y="16" font-family="Arial" font-size="12" fill="#fff">AI</text>
    </a>
    <!-- tooltip bubble -->
    <g transform="translate(0,40)">
      <rect x="0" y="0" width="380" height="56" rx="8" ry="8" fill="#ffffff" stroke="#e1e4e8" />
      <text x="12" y="20" font-family="Arial" font-size="12" fill="#222">AI — Artificial Intelligence</text>
      <text x="12" y="38" font-family="Arial" font-size="11" fill="#444">Artificial intelligence is the simulation of human intelligence by machines.</text>
    </g>
  </g>
</svg>
